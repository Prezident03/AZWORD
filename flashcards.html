<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>AzWord — Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="premium-pages.css"/>
  <link rel="stylesheet" href="mobile.css"/>
  <script src="error-state.js"></script>
  <script src="pwa-init.js"></script>
  <script src="transition.js"></script>
  <script src="ripple.js"></script>
  <script src="brand.js"></script>
  <script src="confetti.js"></script>
  <script src="sound.js"></script>
  <script src="effects.js"></script>
  <script src="mobile-nav.js" defer></script>
  <script src="touch-ux.js" defer></script>
  <style>
    html, body { overflow-x: hidden; }
    body { background: var(--bg-page); min-height: 100vh; }

    .fc-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 18px 32px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Topbar ── */
    .fc-topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .fc-back {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      color: var(--text-main);
      cursor: pointer;
    }
    .fc-progress-info { flex: 1; min-width: 0; }
    .fc-topic-name {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fc-progress-bar {
      width: 100%; height: 6px;
      background: var(--bg-hover, var(--bg-card));
      border-radius: 6px;
      overflow: hidden;
    }
    .fc-progress-fill {
      height: 100%; width: 0%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), var(--rose));
      transition: width 400ms ease;
    }
    .fc-progress-text {
      font-family: var(--font-display);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Card stage ── */
    .fc-card-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 380px;
      touch-action: pan-y;
    }
    .fc-card {
      width: 100%;
      max-width: 400px;
      height: 380px;
      position: absolute;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }
    .fc-card.fc-no-transition { transition: none !important; }
    .fc-card.fc-settle { transition: transform 320ms cubic-bezier(.2,.8,.2,1); }
    .fc-card.fc-enter {
      animation: fcEnter 320ms cubic-bezier(.2,.8,.2,1);
    }
    @keyframes fcEnter {
      from { opacity: 0; transform: scale(0.94) translateY(14px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .fc-card.fc-fly-left  { transition: transform 380ms ease, opacity 380ms ease; transform: translate(-140%, -10%) rotate(-24deg); opacity: 0; }
    .fc-card.fc-fly-right { transition: transform 380ms ease, opacity 380ms ease; transform: translate(140%, -10%) rotate(24deg); opacity: 0; }

    .fc-card-flip {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 480ms cubic-bezier(.4,.1,.2,1);
    }
    .fc-card.fc-flipped .fc-card-flip { transform: rotateY(180deg); }

    .fc-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 26px;
      border: 1.5px solid var(--border);
      background: linear-gradient(155deg, var(--bg-card), var(--bg-elevated, var(--bg-card)));
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 26px;
      text-align: center;
      overflow: hidden;
    }
    .fc-face::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 0%, rgba(124,58,237,0.16), transparent 55%),
                  radial-gradient(ellipse at 100% 100%, rgba(236,72,153,0.12), transparent 55%);
      pointer-events: none;
    }
    .fc-face > * { position: relative; z-index: 1; }

    .fc-face-back { transform: rotateY(180deg); }

    .fc-word {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      color: var(--text-main);
      line-height: 1.15;
      word-break: break-word;
    }
    .fc-ipa {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .fc-pos-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 12px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--primary-light);
      background: rgba(124,58,237,0.14);
      border: 1px solid rgba(124,58,237,0.3);
    }
    .fc-hint {
      margin-top: 14px;
      font-size: 0.76rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .fc-speak-btn {
      margin-top: 18px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1.5px solid var(--border-light);
      background: var(--primary-glow);
      color: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .fc-face-back .fc-word { font-size: 1.6rem; color: var(--primary-light); }
    .fc-example {
      margin-top: 16px;
      font-size: 0.9rem;
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 300px;
    }

    /* stamp overlays that fade in as you drag */
    .fc-stamp {
      position: absolute;
      top: 26px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      padding: 6px 16px;
      border-radius: 10px;
      border: 3px solid;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      text-transform: uppercase;
    }
    .fc-stamp-no  { left: 20px; color: var(--danger); border-color: var(--danger); transform: rotate(-14deg); }
    .fc-stamp-yes { right: 20px; color: var(--success); border-color: var(--success); transform: rotate(14deg); }

    /* ── Bottom action buttons ── */
    .fc-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }
    .fc-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 600;
    }
    .fc-btn-circle {
      width: 58px; height: 58px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      transition: transform var(--dur-fast, 180ms), border-color var(--dur-fast, 180ms);
      font-size: 1.4rem;
      font-weight: 800;
    }
    .fc-btn:active .fc-btn-circle { transform: scale(0.9); }
    .fc-btn-no .fc-btn-circle { color: var(--danger); }
    .fc-btn-no .fc-btn-circle:active, .fc-btn-no.fc-pressed .fc-btn-circle { border-color: var(--danger); background: var(--danger-glow); }
    .fc-btn-maybe .fc-btn-circle { color: #fbbf24; font-size: 1.5rem; width: 50px; height: 50px; }
    .fc-btn-maybe.fc-pressed .fc-btn-circle { border-color: #fbbf24; background: rgba(251,191,36,0.12); }
    .fc-btn-yes .fc-btn-circle { color: var(--success); }
    .fc-btn-yes.fc-pressed .fc-btn-circle { border-color: var(--success); background: var(--success-glow); }

    /* ── Loading ── */
    .fc-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 80px 20px; color: var(--text-muted); font-size: 0.9rem;
    }

    /* ── Done screen ── */
    .fc-done {
      max-width: 420px; margin: 60px auto; padding: 0 20px;
      text-align: center;
    }
    .fc-done-emoji { font-size: 3rem; margin-bottom: 10px; }
    .fc-done h2 {
      font-family: var(--font-display); font-size: 1.4rem; font-weight: 800;
      color: var(--text-main); margin: 0 0 6px;
    }
    .fc-done p { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 26px; }
    .fc-done-stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
    .fc-done-stat {
      flex: 1; max-width: 110px;
      background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 14px 8px;
    }
    .fc-done-stat .num { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }
    .fc-done-stat .lbl { font-size: 0.68rem; color: var(--text-dim); margin-top: 3px; text-transform: uppercase; letter-spacing: .02em; }
    .fc-done-stat.no .num { color: var(--danger); }
    .fc-done-stat.maybe .num { color: #fbbf24; }
    .fc-done-stat.yes .num { color: var(--success); }
    .fc-done-actions { display: flex; flex-direction: column; gap: 10px; }
    .fc-done-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; border: none; font-family: var(--font-body);
      text-decoration: none;
    }
    .fc-done-btn.primary { background: linear-gradient(135deg, var(--primary), var(--rose)); color: #fff; }
    .fc-done-btn.secondary { background: var(--bg-card); border: 1.5px solid var(--border); color: var(--text-main); }

    @media (max-width: 420px) {
      .fc-card { height: 340px; }
      .fc-word { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <div class="fc-wrap" id="fc-wrap">
    <div class="fc-topbar">
      <button class="fc-back" id="fc-back-btn" aria-label="Orqaga">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="fc-progress-info">
        <div class="fc-topic-name" id="fc-topic-name">Yuklanmoqda...</div>
        <div class="fc-progress-bar"><div class="fc-progress-fill" id="fc-progress-fill"></div></div>
        <div class="fc-progress-text" id="fc-progress-text">— / —</div>
      </div>
    </div>

    <div class="fc-card-stage" id="fc-card-stage">
      <div class="fc-loading" id="fc-loading">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Kartalar yuklanmoqda...
      </div>
    </div>

    <div class="fc-actions" id="fc-actions" style="display:none">
      <button class="fc-btn fc-btn-no" id="fc-btn-no">
        <span class="fc-btn-circle">✕</span>
        Bilmayman
      </button>
      <button class="fc-btn fc-btn-maybe" id="fc-btn-maybe">
        <span class="fc-btn-circle">?</span>
        Ishonchim yo'q
      </button>
      <button class="fc-btn fc-btn-yes" id="fc-btn-yes">
        <span class="fc-btn-circle">✓</span>
        Bilaman
      </button>
    </div>
  </div>

  <div class="fc-done" id="fc-done" style="display:none">
    <div class="fc-done-emoji">🎉</div>
    <h2>Bo'lim yakunlandi!</h2>
    <p id="fc-done-sub">Barcha kartalarni ko'rib chiqdingiz.</p>
    <div class="fc-done-stats">
      <div class="fc-done-stat yes"><div class="num" id="fc-stat-yes">0</div><div class="lbl">Bilaman</div></div>
      <div class="fc-done-stat maybe"><div class="num" id="fc-stat-maybe">0</div><div class="lbl">Shubhali</div></div>
      <div class="fc-done-stat no"><div class="num" id="fc-stat-no">0</div><div class="lbl">Bilmayman</div></div>
    </div>
    <div class="fc-done-actions">
      <button class="fc-done-btn primary" id="fc-retry-btn" style="display:none">↻ Qiyin so'zlarni takrorlash</button>
      <a class="fc-done-btn secondary" id="fc-exit-btn" href="folders.html">Bo'limga qaytish</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    let folderId = params.get('id');
    let bookId = params.get('book');
    let topicId = params.get('topic');
    let topicLabel = params.get('name') || '';

    // Agar URL'da hech narsa bo'lmasa, oxirgi ko'rilgan mavzuni ishlatamiz
    if (!folderId && !bookId) {
      try {
        const last = JSON.parse(localStorage.getItem('az:lastFolder') || 'null');
        if (last && last.id) {
          if (last.kind === 'book') bookId = last.id; else folderId = last.id;
          topicId = last.topic || null;
          topicLabel = last.topicName || last.name || '';
        }
      } catch (e) {}
    }

    const isBookMode = !!(bookId && topicId);
    const isFolderTopicMode = !!(folderId && topicId && !bookId);
    const backHref = isBookMode
      ? `book.html?id=${bookId}`
      : folderId
        ? `folder.html?id=${folderId}`
        : 'folders.html';
    document.getElementById('fc-back-btn').addEventListener('click', () => { window.location.href = backHref; });
    document.getElementById('fc-exit-btn').href = backHref;

    let words = [];
    let deck = [];      // {word, id} queue being reviewed this pass
    let index = 0;
    let results = { yes: [], maybe: [], no: [] };
    let currentUser = null;
    let dragging = false;
    let startX = 0, startY = 0, dx = 0;
    let justDragged = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      if (!folderId && !bookId) { window.location.href = 'folders.html'; return; }
      await loadWords();
    });

    async function loadWords() {
      const wordsRef = isBookMode
        ? collection(db, 'books', bookId, 'topics', topicId, 'words')
        : isFolderTopicMode
          ? collection(db, 'folders', folderId, 'topics', topicId, 'words')
          : collection(db, 'folders', folderId, 'words');
      let snap;
      try {
        snap = await getDocs(query(wordsRef, orderBy('createdAt', 'asc')));
      } catch (e) {
        console.error('flashcards loadWords xato:', e);
        document.getElementById('fc-loading').textContent = 'Xato: so\u2018zlarni yuklab bo\u2018lmadi.';
        return;
      }
      words = [];
      snap.forEach(d => words.push({ id: d.id, ...d.data() }));

      if (words.length === 0) { window.location.href = backHref; return; }

      document.getElementById('fc-topic-name').textContent = topicLabel || `${words.length} ta so'z`;
      startDeck(words);
    }

    function startDeck(list) {
      deck = list.slice();
      index = 0;
      results = { yes: [], maybe: [], no: [] };
      document.getElementById('fc-done').style.display = 'none';
      document.getElementById('fc-wrap').style.display = 'flex';
      document.getElementById('fc-actions').style.display = 'flex';
      renderCard(true);
    }

    function updateProgress() {
      const pct = deck.length ? Math.round((index / deck.length) * 100) : 0;
      document.getElementById('fc-progress-fill').style.width = pct + '%';
      document.getElementById('fc-progress-text').textContent = `${Math.min(index + 1, deck.length)} / ${deck.length}`;
    }

    function renderCard(isFirst) {
      updateProgress();
      const stage = document.getElementById('fc-card-stage');
      if (index >= deck.length) { finishDeck(); return; }

      const word = deck[index];
      const exStr = word.example ? word.example.replace(/\\/g, '\\\\').replace(/'/g, "\\'") : '';

      const card = document.createElement('div');
      card.className = 'fc-card fc-enter';
      card.id = 'fc-active-card';
      card.innerHTML = `
        <div class="fc-stamp fc-stamp-no" id="fc-stamp-no">Bilmayman</div>
        <div class="fc-stamp fc-stamp-yes" id="fc-stamp-yes">Bilaman</div>
        <div class="fc-card-flip">
          <div class="fc-face fc-face-front">
            <div class="fc-word">${escapeHtml(word.en || '')}</div>
            ${word.ipa ? `<div class="fc-ipa">${escapeHtml(word.ipa)}</div>` : ''}
            ${word.pos ? `<div class="fc-pos-badge">${escapeHtml(word.pos)}</div>` : ''}
            <button class="fc-speak-btn" id="fc-speak-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <div class="fc-hint">Tarjimani ko'rish uchun bosing</div>
          </div>
          <div class="fc-face fc-face-back">
            <div class="fc-word">${escapeHtml(word.uz || '')}</div>
            ${exStr ? `<div class="fc-example">\u201c${escapeHtml(exStr)}\u201d</div>` : ''}
            <div class="fc-hint">Yana bosing — so'zga qaytish</div>
          </div>
        </div>
      `;
      stage.innerHTML = '';
      stage.appendChild(card);
      attachCardEvents(card);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    window.fcSpeak = function (text) {
      if (window.AzSound && window.AzSound.play) window.AzSound.play('click');
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-GB';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    };

    function attachCardEvents(card) {
      const flip = card.querySelector('.fc-card-flip');
      const stampNo = card.querySelector('#fc-stamp-no');
      const stampYes = card.querySelector('#fc-stamp-yes');
      const speakBtn = card.querySelector('#fc-speak-btn');
      if (speakBtn) {
        speakBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          window.fcSpeak((deck[index] && deck[index].en) || '');
        });
      }

      function onStart(x, y) {
        dragging = true; startX = x; startY = y; dx = 0;
        card.classList.add('fc-no-transition');
      }
      function onMove(x, y) {
        if (!dragging) return;
        dx = x - startX;
        const dy = y - startY;
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        const rotate = dx / 18;
        card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
        const t = Math.min(Math.abs(dx) / 110, 1);
        if (dx < 0) { stampNo.style.opacity = t; stampYes.style.opacity = 0; }
        else { stampYes.style.opacity = t; stampNo.style.opacity = 0; }
      }
      function onEnd() {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('fc-no-transition');
        card.classList.add('fc-settle');

        if (Math.abs(dx) > 90) {
          justDragged = true;
          commit(dx < 0 ? 'no' : 'yes');
        } else if (Math.abs(dx) < 8) {
          // treat as tap → flip
          card.classList.toggle('fc-flipped');
          card.style.transform = '';
          stampNo.style.opacity = 0; stampYes.style.opacity = 0;
        } else {
          // snap back
          card.style.transform = '';
          stampNo.style.opacity = 0; stampYes.style.opacity = 0;
        }
        dx = 0;
        setTimeout(() => { justDragged = false; }, 60);
      }

      card.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
      card.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
      card.addEventListener('touchend', onEnd);

      let mouseDown = false;
      card.addEventListener('mousedown', e => { mouseDown = true; onStart(e.clientX, e.clientY); });
      window.addEventListener('mousemove', e => { if (mouseDown) onMove(e.clientX, e.clientY); });
      window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; onEnd(); } });

      card.addEventListener('click', () => {
        if (justDragged) return;
      });
    }

    function commit(action) {
      const word = deck[index];
      if (!word) return;
      results[action].push(word);

      const card = document.getElementById('fc-active-card');
      if (card) {
        card.classList.add(action === 'no' ? 'fc-fly-left' : 'fc-fly-right');
      }
      if (window.AzSound && window.AzSound.play) {
        window.AzSound.play(action === 'no' ? 'wrong' : 'click');
      }
      if (action === 'yes' && window.AzConfetti && Math.random() < 0.3) {
        window.AzConfetti.preset('study-correct');
      }

      index++;
      setTimeout(() => renderCard(false), action ? 260 : 0);
    }

    document.getElementById('fc-btn-no').addEventListener('click', () => pressAndCommit('fc-btn-no', 'no'));
    document.getElementById('fc-btn-maybe').addEventListener('click', () => pressAndCommit('fc-btn-maybe', 'maybe'));
    document.getElementById('fc-btn-yes').addEventListener('click', () => pressAndCommit('fc-btn-yes', 'yes'));

    function pressAndCommit(btnId, action) {
      const btn = document.getElementById(btnId);
      btn.classList.add('fc-pressed');
      setTimeout(() => btn.classList.remove('fc-pressed'), 220);
      const card = document.getElementById('fc-active-card');
      if (card && action === 'maybe') {
        // maybe uchun kartani biroz pastga tushirib, keyingisiga o'tamiz (swipe yo'q)
        card.style.transition = 'transform 260ms ease, opacity 260ms ease';
        card.style.transform = 'translateY(30px) scale(0.94)';
        card.style.opacity = '0';
      }
      commit(action);
    }

    function finishDeck() {
      document.getElementById('fc-actions').style.display = 'none';
      document.getElementById('fc-card-stage').innerHTML = '';
      document.getElementById('fc-done').style.display = 'block';
      document.getElementById('fc-stat-yes').textContent = results.yes.length;
      document.getElementById('fc-stat-maybe').textContent = results.maybe.length;
      document.getElementById('fc-stat-no').textContent = results.no.length;

      const weak = [...results.no, ...results.maybe];
      const retryBtn = document.getElementById('fc-retry-btn');
      if (weak.length > 0) {
        retryBtn.style.display = 'flex';
        retryBtn.textContent = `\u21bb ${weak.length} ta qiyin so'zni takrorlash`;
        retryBtn.onclick = () => startDeck(weak);
      } else {
        retryBtn.style.display = 'none';
      }

      if (results.no.length === 0 && window.AzConfetti) {
        window.AzConfetti.preset('study-correct');
      }
    }
  </script>
</body>
</html>
