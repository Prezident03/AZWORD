<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profil · AzWord</title>
  <meta name="description" content="Foydalanuvchi profili va yutuqlar.">
  <meta name="theme-color" content="#0e0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var p=JSON.parse(localStorage.getItem('az:prefs')||'{}'),t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.effects===false)document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <script type="module" src="js/pages/profile.js"></script>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"><div class="boot-logo"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 50 L32 14 L47 50"/><path d="M22.5 38 L41.5 38"/></svg></div></div></div>
  <main class="page page-narrow">
    <section class="card card-lg card-glow fade-up" id="head"></section>
    <section class="section">
      <div class="grid-4 stagger" id="stats"></div>
    </section>
    <section class="section">
      <div class="section-head"><h2 class="section-title" id="edit-title"></h2></div>
      <div class="card">
        <form id="name-form" class="row wrap" style="align-items:flex-end">
          <div class="field grow" style="margin:0;min-width:200px"><label class="label" for="name">Ism</label><input class="input" id="name" maxlength="40" autocomplete="name"></div>
          <button class="btn btn-primary" type="submit">Saqlash</button>
        </form>
        <hr class="divider">
        <div class="setting-row"><div class="setting-info"><div class="setting-name">Email</div><div class="setting-desc" id="email"></div></div></div>
        <div class="setting-row" id="pw-row"><div class="setting-info"><div class="setting-name">Parol</div><div class="setting-desc">Parolni tiklash havolasi emailingizga yuboriladi</div></div><button class="btn btn-sm" id="reset-pw">Havola yuborish</button></div>
      </div>
    </section>
    <section class="section">
      <div class="card card-flush"><div class="list" id="links"></div></div>
    </section>
  </main>
</body>
</html>
