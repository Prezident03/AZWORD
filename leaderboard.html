<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AzWord — Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="transition.js"></script>
  <script src="ripple.js"></script>
  <script src="cursor-glow.js"></script>
  <script src="brand.js"></script>
  <script src="confetti.js"></script>
  <script src="sound.js"></script>
  <script src="search.js"></script>
  <script src="effects.js"></script>
  <script src="parallax.js"></script>
  <style>
    .lb-page { max-width: 760px; margin: 0 auto; padding: 36px 24px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 28px;
      font-family: 'Inter', sans-serif;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--text-main); }

    .lb-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .lb-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
    .lb-header p { color: var(--text-muted); font-size: 0.9rem; }

    .lb-tabs {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .lb-tab {
      flex: 1;
      padding: 11px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .lb-tab.active {
      background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
      color: #fff;
    }

    .week-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(124,58,237,0.08);
      border: 1px solid rgba(124,58,237,0.2);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .week-info span { color: var(--purple-light); font-weight: 600; }

    .lb-list { display: flex; flex-direction: column; gap: 10px; }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .lb-item:hover { border-color: var(--purple-main); transform: translateX(4px); }

    .lb-item.rank-1 {
      border-color: rgba(251,191,36,0.5);
      background: rgba(251,191,36,0.05);
    }
    .lb-item.rank-2 {
      border-color: rgba(148,163,184,0.4);
      background: rgba(148,163,184,0.04);
    }
    .lb-item.rank-3 {
      border-color: rgba(180,120,60,0.4);
      background: rgba(180,120,60,0.04);
    }
    .lb-item.is-me {
      border-color: rgba(124,58,237,0.5);
      background: rgba(124,58,237,0.06);
    }

    .lb-rank {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      min-width: 36px;
      text-align: center;
      color: var(--text-dim);
    }
    .lb-item.rank-1 .lb-rank { color: #fbbf24; font-size: 1.4rem; }
    .lb-item.rank-2 .lb-rank { color: #94a3b8; font-size: 1.2rem; }
    .lb-item.rank-3 .lb-rank { color: #b4783c; font-size: 1.15rem; }

    .lb-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 1rem;
      flex-shrink: 0; overflow: hidden;
    }
    .lb-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .lb-info { flex: 1; }
    .lb-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .lb-name .you-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.68rem;
      background: var(--purple-glow);
      border: 1px solid var(--purple-main);
      color: var(--purple-light);
      border-radius: 99px;
      padding: 1px 7px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
    }
    .lb-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .lb-score {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .lb-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .lb-empty .emoji { font-size: 2.5rem; margin-bottom: 12px; }

    .lb-loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .my-rank-banner {
      background: rgba(124,58,237,0.1);
      border: 1.5px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .my-rank-banner .rank-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--purple-light);
    }

    @media (max-width: 640px) {
      .lb-page { padding: 20px 16px; }
      .lb-tabs { flex-direction: row; }
      .lb-tab { padding: 9px 8px; font-size: 0.82rem; }
      .lb-item { padding: 12px 14px; gap: 10px; }
      .lb-avatar { width: 36px; height: 36px; font-size: 0.9rem; }
      .lb-score { font-size: 0.95rem; }
      .lb-name { font-size: 0.88rem; }
      .lb-sub { font-size: 0.72rem; }
      .lb-rank { min-width: 30px; font-size: 1rem; }
      .week-info { flex-direction: column; gap: 4px; font-size: 0.8rem; }
      .my-rank-banner { flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="nav-logo" href="dashboard.html"><img src="logo.png" alt="AzWord"></a>
    <div class="nav-user">
      <div class="nav-badges">
        <div class="nav-badge star">
          <span class="badge-icon" id="lb-star-icon"></span>
          <span class="badge-val" id="nav-stars">0</span>
        </div>
        <div class="nav-badge coin">
          <span class="badge-icon" id="lb-coin-icon"></span>
          <span class="badge-val" id="nav-coins">0</span>
        </div>
      </div>
      <div class="profile-avatar" id="nav-avatar" onclick="window.location.href='profile.html'" style="cursor:pointer;" title="Profil">A</div>
    </div>
  </nav>

  <div class="lb-page">

    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Orqaga
    </button>

    <div class="lb-header">
      <h1><span style="display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle" id="lb-title-icon"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span>Leaderboard</h1>
      <p>Eng ko'p so'z o'rganganlar reytingi</p>
    </div>

    <div class="lb-tabs">
      <button class="lb-tab active" onclick="switchTab('weekly')" id="lb-tab-weekly"><span id="lb-weekly-icon" style="display:inline-flex;vertical-align:middle;margin-right:4px"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>Haftalik</button>
      <button class="lb-tab" onclick="switchTab('alltime')" id="lb-tab-alltime"><span id="lb-alltime-icon" style="display:inline-flex;vertical-align:middle;margin-right:4px"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.019a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg></span>Alltime</button>
    </div>

    <div class="week-info" id="week-info">
      <span id="lb-cal-icon" style="display:inline-flex;vertical-align:middle;margin-right:4px"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span id="week-label">Yuklanmoqda...</span>
      &nbsp;·&nbsp; Dushanbada reset bo'ladi
    </div>

    <div class="lb-list" id="lb-list">
      <div class="lb-loading"><span id="lb-loading-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Yuklanmoqda...</div>
    </div>

    <div class="my-rank-banner" id="my-rank-banner" style="display:none">
      <span>Sizning o'rningiz:</span>
      <span class="rank-num" id="my-rank-num">#—</span>
      <span id="my-rank-score"></span>
    </div>

  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, getDocs, doc, getDoc, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { icon, fromEmoji, starIcon, PATHS, escapeHtml } from './icons.js';

    let currentUser = null;
    let currentTab = 'weekly';
    let allUsers = [];

    function getWeekKey() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const weekNum = Math.ceil((((now - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
      return `${now.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;
    }

    function getWeekLabel() {
      const now = new Date();
      const monday = new Date(now);
      monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const fmt = d => `${d.getDate()}-${d.toLocaleString('uz', {month:'short'})}`;
      return `${fmt(monday)} — ${fmt(sunday)}`;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = 'index.html';
      currentUser = user;

      document.getElementById('lb-star-icon').innerHTML = starIcon(14);
      document.getElementById('lb-coin-icon').innerHTML = icon('coins',{size:14, color:'#34d399'});
      document.getElementById('lb-title-icon').innerHTML = icon('trophy',{size:26});
      document.getElementById('lb-weekly-icon').innerHTML = icon('flame',{size:14,color:'#fb923c'});
      document.getElementById('lb-alltime-icon').innerHTML = icon('crown',{size:14,color:'#fbbf24'});
      document.getElementById('lb-cal-icon').innerHTML = icon('calendar',{size:14});
      document.getElementById('lb-loading-icon').innerHTML = icon('clock',{size:16,color:'var(--text-dim)'});

      const letter = (user.displayName || user.email).charAt(0).toUpperCase();
      try {
        const uDoc = await getDoc(doc(db, 'users', user.uid));
        if (uDoc.exists()) {
          const d = uDoc.data();
          document.getElementById('nav-stars').textContent = d.stars || 0;
          document.getElementById('nav-coins').textContent = d.coins || 0;
          if (d.photoBase64) {
            document.getElementById('nav-avatar').innerHTML = `<img src="${d.photoBase64}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;">`;
          } else {
            document.getElementById('nav-avatar').textContent = letter;
          }
        }
      } catch(e) {}

      document.getElementById('week-label').textContent = getWeekLabel();
      await loadAllUsers();
      renderBoard('weekly');
    });

    async function loadAllUsers() {
      let snap;
      try {
        snap = await getDocs(collection(db, 'users'));
      } catch(e) {
        console.error('loadAllUsers xato:', e);
        document.getElementById('lb-list').innerHTML = `<div class="lb-empty"><div class="emoji">${icon('alert-triangle',{size:42,color:'#fbbf24'})}</div><p>Xato: ${e.message}</p></div>`;
        return;
      }
      allUsers = [];
      const currentWeekKey = getWeekKey();

      snap.forEach(d => {
        const data = d.data();
        const weeklyStars = data.weekKey === currentWeekKey ? (data.weeklyStars || 0) : 0;
        let userName = data.displayName || data.name || '';
        if (!userName && data.email) {
          userName = data.email.split('@')[0];
        }
        if (!userName) userName = 'Foydalanuvchi';

        allUsers.push({
          uid: d.id,
          name: userName,
          photo: data.photoBase64 || null,
          stars: data.stars || 0,
          weeklyStars: weeklyStars,
          coins: data.coins || 0,
        });
      });
    }

    window.switchTab = (tab) => {
      currentTab = tab;
      document.getElementById('lb-tab-weekly').classList.toggle('active', tab === 'weekly');
      document.getElementById('lb-tab-alltime').classList.toggle('active', tab === 'alltime');
      document.getElementById('week-info').style.display = tab === 'weekly' ? 'flex' : 'none';
      renderBoard(tab);
    };

    function rankIcon(i) {
      if (i===0) return icon('crown',{size:28,color:'#fbbf24'});
      if (i===1) return icon('medal',{size:28,color:'#d1d5db'});
      if (i===2) return icon('medal',{size:28,color:'#cd7f32'});
      return `<span style="font-weight:700;color:var(--text-dim);font-size:1.1rem">#${i+1}</span>`;
    }

    function renderBoard(tab) {
      const list = document.getElementById('lb-list');
      const scoreField = tab === 'weekly' ? 'weeklyStars' : 'stars';

      const sorted = [...allUsers]
        .filter(u => u[scoreField] > 0)
        .sort((a, b) => b[scoreField] - a[scoreField]);

      if (sorted.length === 0) {
        list.innerHTML = `
          <div class="lb-empty">
            <div class="emoji">${tab === 'weekly' ? icon('flame',{size:42,color:'#fb923c'}) : icon('crown',{size:42,color:'#fbbf24'})}</div>
            <p>${tab === 'weekly' ? 'Bu hafta hali hech kim ball yig\'magan' : 'Hali hech kim ball yig\'magan'}</p>
          </div>`;
        document.getElementById('my-rank-banner').style.display = 'none';
        return;
      }

      const top10 = sorted.slice(0, 10);

      list.innerHTML = '';
      top10.forEach((user, i) => {
        const rank = i + 1;
        const isMe = user.uid === currentUser.uid;
        const div = document.createElement('div');
        div.className = `lb-item ${rank <= 3 ? `rank-${rank}` : ''} ${isMe ? 'is-me' : ''}`;

        const safeName = escapeHtml(user.name);
        const avatarContent = user.photo
          ? `<img src="${user.photo}" alt="avatar">`
          : escapeHtml(user.name.charAt(0).toUpperCase());

        div.innerHTML = `
          <div class="lb-rank">${rankIcon(i)}</div>
          <div class="lb-avatar">${avatarContent}</div>
          <div class="lb-info">
            <div class="lb-name">
              ${safeName}
              ${isMe ? '<span class="you-badge">Siz</span>' : ''}
            </div>
            <div class="lb-sub">${icon('coins',{size:14,color:'#34d399'})} ${user.coins} tanga</div>
          </div>
          <div class="lb-score">${starIcon(16)} ${user[scoreField]}</div>
        `;
        list.appendChild(div);
      });

      const myRank = sorted.findIndex(u => u.uid === currentUser.uid);
      const myRankBanner = document.getElementById('my-rank-banner');

      if (myRank >= 10) {
        myRankBanner.style.display = 'flex';
        document.getElementById('my-rank-num').textContent = `#${myRank + 1}`;
        document.getElementById('my-rank-score').innerHTML = `${starIcon(16)} ${sorted[myRank][scoreField]}`;
      } else {
        myRankBanner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
