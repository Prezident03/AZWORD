<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Statistika · AzWord</title>
  <meta name="description" content="O'rganish statistikasi va grafiklar.">
  <meta name="theme-color" content="#0e0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var p=JSON.parse(localStorage.getItem('az:prefs')||'{}'),t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.effects===false)document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <script type="module" src="js/pages/stats.js"></script>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"><div class="boot-logo"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 50 L32 14 L47 50"/><path d="M22.5 38 L41.5 38"/></svg></div></div></div>
  <main class="page">
    <div class="page-head"><div><h1 class="page-title">Statistika</h1><p class="page-sub">O'sishingizni kuzating</p></div></div>
    <div class="grid-4 stagger" id="kpis"></div>
    <div class="grid-2 section">
      <div class="card"><div class="card-head"><div class="card-title" id="t-activity"></div><span class="xs dim">so'nggi 14 kun</span></div><div class="bars" id="activity"></div></div>
      <div class="card"><div class="card-head"><div class="card-title" id="t-acc"></div><span class="xs dim">so'nggi mashg'ulotlar</span></div><div class="bars" id="accuracy"></div></div>
    </div>
    <div class="grid-2 section">
      <div class="card"><div class="card-head"><div class="card-title" id="t-level"></div></div><div id="level"></div></div>
      <div class="card"><div class="card-head"><div class="card-title" id="t-modes"></div></div><div id="modes"></div></div>
    </div>
    <section class="section">
      <div class="section-head"><h2 class="section-title" id="t-hard"></h2><a class="btn btn-ghost btn-sm" href="vocabulary.html">Lug'atim</a></div>
      <div class="card card-flush" id="hard"></div>
    </section>
  </main>
</body>
</html>
