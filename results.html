<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AzWord — Natija</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="transition.js"></script>
  <script src="ripple.js"></script>
  <script src="cursor-glow.js"></script>
  <script src="confetti.js"></script>
  <script src="sound.js"></script>
  <script src="parallax.js"></script>
  <style>
    .results-wrap { max-width: 700px; margin: 0 auto; padding: 40px 24px; }

    .results-hero { text-align: center; margin-bottom: 40px; }
    .results-emoji { font-size: 4rem; margin-bottom: 16px; }
    .results-hero h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .results-hero p { color: var(--text-muted); font-size: 0.95rem; }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--purple-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
      background: var(--purple-glow);
    }

    .score-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--purple-light);
      line-height: 1;
    }

    .score-total { font-size: 0.8rem; color: var(--text-muted); }

    .section-label { margin-bottom: 14px; }

    .result-item {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .result-item.perfect { border-color: rgba(52,211,153,0.4); }
    .result-item.has-mistakes { border-color: rgba(248,113,113,0.3); }

    .result-icon { font-size: 1.3rem; min-width: 28px; text-align: center; margin-top: 2px; }

    .result-word { flex: 1; }

    .result-en {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
    }

    .result-uz { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

    .result-mistakes { font-size: 0.78rem; color: var(--danger); margin-top: 4px; }
    .result-ok { font-size: 0.78rem; color: var(--success); margin-top: 4px; }

    .correct-answer-box {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(124,58,237,0.08);
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: 8px;
    }

    .correct-answer-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .correct-answer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .correct-en {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--purple-light);
    }

    .correct-arrow { color: var(--text-dim); font-size: 0.9rem; }

    .correct-uz {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .correct-example {
      font-size: 0.78rem;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 4px;
    }

    .mistakes-section { margin-bottom: 32px; }
    .mistakes-section .section-label { color: var(--danger); }

    .results-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn-retry {
      flex: 1;
      padding: 14px;
      background: transparent;
      border: 1.5px solid var(--purple-main);
      border-radius: 12px;
      color: var(--purple-light);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn-retry:hover { background: var(--purple-glow); }

    .btn-home {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.2s;
    }
    .btn-home:hover { opacity: 0.88; }

    .reward-box {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    .reward-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .reward-icon { font-size: 2rem; }
    .reward-amount {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .reward-amount.star { color: #fbbf24; }
    .reward-amount.coin { color: #34d399; }
    .reward-label { font-size: 0.75rem; color: var(--text-muted); }
    .reward-divider { width: 1px; height: 48px; background: var(--border); }

    .score-pop { animation: scorePop 0.5s ease; }
    @keyframes scorePop { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="nav-logo" href="dashboard.html"><img src="logo.png" alt="AzWord"></a>
    <div class="nav-user">
      <button class="btn-sm" onclick="window.location.href='dashboard.html'">Dashboard</button>
    </div>
  </nav>

  <div class="results-wrap">

    <div class="results-hero">
      <div class="results-emoji" id="result-emoji"></div>
      <h1 id="result-title">Mashq yakunlandi!</h1>
      <p id="result-subtitle">Natijalaringiz quyida</p>

      <div class="score-circle">
        <div class="score-num" id="score-num">0/0</div>
        <div class="score-total">mukammal so'z</div>
      </div>
    </div>

    <div id="mistakes-section" style="display:none" class="mistakes-section">
      <div class="section-label" id="mistakes-label" style="color:var(--danger)"><span id="mistakes-label-icon" style="display:inline-flex;align-items:center;vertical-align:middle;margin-right:6px"></span>Xato qilingan so'zlar — to'g'ri javoblar</div>
      <div id="mistakes-list"></div>
    </div>

    <div class="section-label" id="all-label"><span id="all-label-icon" style="display:inline-flex;align-items:center;vertical-align:middle;margin-right:6px"></span>Barcha so'zlar natijalari</div>
    <div id="results-list"></div>

    <div class="results-actions">
      <button class="btn-retry" onclick="retry()"><span id="retry-icon-wrap" style="display:inline-flex;vertical-align:middle;margin-right:6px"></span>Qaytadan ishlash</button>
      <button class="btn-home" onclick="window.location.href='dashboard.html'"><span id="home-icon-wrap" style="display:inline-flex;vertical-align:middle;margin-right:6px"></span>Bosh sahifa</button>
    </div>

  </div>

  <script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let _ctx = null;
  function getCtx() { if (!_ctx) _ctx = new AudioCtx(); return _ctx; }
  window.playSound = function(type) {
    try {
      const ctx = getCtx();
      if (type === 'correct') {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        o.start(); o.stop(ctx.currentTime + 0.3);
      } else if (type === 'wrong') {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(300, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
        g.gain.setValueAtTime(0.2, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        o.start(); o.stop(ctx.currentTime + 0.2);
      } else if (type === 'coin') {
        [0, 0.08].forEach((d, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(i===0?1047:1319, ctx.currentTime+d);
          g.gain.setValueAtTime(0.25, ctx.currentTime+d);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+d+0.25);
          o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+0.25);
        });
      } else if (type === 'victory') {
        [523,659,784,1047].forEach((f,i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(f, ctx.currentTime+i*0.12);
          g.gain.setValueAtTime(0.25, ctx.currentTime+i*0.12);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.12+0.3);
          o.start(ctx.currentTime+i*0.12); o.stop(ctx.currentTime+i*0.12+0.3);
        });
      } else if (type === 'achievement') {
        [784,988,1175,1568].forEach((f,i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = i<3?'sine':'triangle';
          o.frequency.setValueAtTime(f, ctx.currentTime+i*0.1);
          g.gain.setValueAtTime(0.2, ctx.currentTime+i*0.1);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.1+0.5);
          o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.5);
        });
      }
    } catch(e) {}
  };
</script>
  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc, increment, collection, getDocs, updateDoc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { icon, starIcon, fromEmoji } from './icons.js';

    document.getElementById('retry-icon-wrap').innerHTML = icon('activity', {size:18,color:'var(--purple-light)'});
    document.getElementById('home-icon-wrap').innerHTML = icon('home', {size:18,color:'var(--purple-light)'});
    document.getElementById('result-emoji').innerHTML = icon('party-popper', {size:48,color:'#fbbf24'});
    document.getElementById('mistakes-label-icon').innerHTML = icon('x-circle', {size:16,color:'var(--danger)'});
    document.getElementById('all-label-icon').innerHTML = icon('clipboard-list', {size:16,color:'var(--purple-light)'});
    document.getElementById('all-label').innerHTML = icon('clipboard-list', {size:16,color:'var(--purple-light)'}) + ' Barcha so\'zlar natijalari';
    document.getElementById('mistakes-label').innerHTML = icon('x-circle', {size:16,color:'var(--danger)'}) + ' Xato qilingan so\'zlar — to\'g\'ri javoblar';

    const params = new URLSearchParams(window.location.search);
    const folderId = params.get('id');

    const resultsRaw = sessionStorage.getItem('studyResults');
    const wordsRaw = sessionStorage.getItem('studyWords');

    if (!resultsRaw || !wordsRaw) {
      window.location.href = 'dashboard.html';
    }

    const results = JSON.parse(resultsRaw);
    const words = JSON.parse(wordsRaw);

    const STAGE_NAMES = {
      1: 'Tanishish',
      2: 'Variantlar',
      3: "Bo'laklash",
      4: 'Moslashtirish',
      5: 'Yozish'
    };

    const totalWords = words.length;
    const perfectWords = Object.values(results).filter(r => r.mistakes.length === 0).length;
    const mistakeWords = words.filter(w => results[w.id] && results[w.id].mistakes.length > 0);

    document.getElementById('score-num').textContent = `${perfectWords}/${totalWords}`;
    document.getElementById('score-num').classList.add('score-pop');
    setTimeout(() => playSound('victory'), 500);
    setTimeout(() => playSound('victory'), 500);

    // 🎉 #11 Confetti Burst — natijaga qarab
    if (window.AzConfetti) {
      const pctInit = perfectWords / totalWords;
      setTimeout(() => {
        if (pctInit === 1) window.AzConfetti.preset('victory');
        else if (pctInit >= 0.7) window.AzConfetti.preset('success');
        else if (pctInit >= 0.4) window.AzConfetti.burst({ count: 70, palette: 'primary' });
      }, 420);
    }

    function floatReward(type, amount, x, y) {
      const el = document.createElement('div');
      el.className = 'float-reward ' + type;
      el.textContent = '+' + amount + (type === 'coin' ? ' coin' : ' star');
      el.style.cssText = 'left:' + (x||window.innerWidth/2-40) + 'px;top:' + (y||window.innerHeight/2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);
        const udata = userSnap.exists() ? userSnap.data() : {};

        const today = new Date();
        const todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

        const lastDate = udata.lastStudyDate || null;
        let currentStreak = udata.streakDays || 0;

        if (lastDate !== todayKey) {
          const yesterday = new Date(today);
          yesterday.setDate(today.getDate() - 1);
          const yesterdayKey = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2,'0') + '-' + String(yesterday.getDate()).padStart(2,'0');

          if (lastDate === yesterdayKey) {
            currentStreak += 1;
          } else if (lastDate === null) {
            currentStreak = 1;
          } else {
            currentStreak = 1;
          }

          await updateDoc(userRef, {
            streakDays: currentStreak,
            lastStudyDate: todayKey,
            longestStreak: Math.max(currentStreak, udata.longestStreak || 0)
          });

          if (currentStreak > 1) {
            const streakBanner = document.createElement('div');
            streakBanner.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(251,146,60,0.1);border:1.5px solid rgba(251,146,60,0.3);border-radius:14px;padding:14px 20px;margin:0 auto 20px;max-width:400px';
            streakBanner.innerHTML = `
              ${icon('flame',{size:28,color:'#fb923c'})}
              <div>
                <div style="font-weight:700;font-size:1.1rem;color:#fb923c">${currentStreak} kunlik streak!</div>
                <div style="font-size:0.78rem;color:var(--text-muted)">Ajoyib, davom eting!</div>
              </div>
            `;
            document.querySelector('.results-hero').appendChild(streakBanner);
          }
        }
      } catch(e) {
        console.error('Streak xato:', e);
      }

      try {
        const totalWords = words.length;
        const correctWords = words.filter(w => results[w.id] && results[w.id].mistakes.length === 0).length;
        const accuracy = totalWords > 0 ? Math.round((correctWords / totalWords) * 100) : 0;

        await addDoc(collection(db, 'users', user.uid, 'studyLog'), {
          folderId: params.get('id') || '',
          totalWords,
          correctWords,
          accuracy,
          studiedAt: serverTimestamp(),
          dateKey: new Date().toISOString().slice(0, 10)
        });

        for (const word of words) {
          const r = results[word.id];
          if (r && r.mistakes.length >= 2) {
            const wordRef = doc(db, 'folders', params.get('id') || '', 'words', word.id);
            try {
              await updateDoc(wordRef, {
                mistakeCount: increment(r.mistakes.length),
                lastMistakeAt: serverTimestamp()
              });
            } catch(e) {}
          }
        }
      } catch(e) {
        console.error('Statistika saqlashda xato:', e);
      }

      try {
        const perfectWordsList = words.filter(w => results[w.id] && results[w.id].mistakes.length === 0);
        if (perfectWordsList.length === 0) return;

        const folderId = params.get('id');
        if (!folderId) return;

        let newlyRewarded = 0;
        for (const word of perfectWordsList) {
          const wordRef = doc(db, 'folders', folderId, 'words', word.id);
          const wordSnap = await getDoc(wordRef);
          if (wordSnap.exists() && !wordSnap.data().rewarded) {
            await updateDoc(wordRef, { rewarded: true });
            newlyRewarded++;
          }
        }

        if (newlyRewarded > 0) {
          const now = new Date();
          const weekNum = Math.ceil((((now - new Date(now.getFullYear(), 0, 1)) / 86400000) + new Date(now.getFullYear(), 0, 1).getDay() + 1) / 7);
          const weekKey = `${now.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;

          await setDoc(doc(db, 'users', user.uid), {
            coins: increment(newlyRewarded),
            stars: increment(newlyRewarded),
            weeklyStars: increment(newlyRewarded),
            weekKey: weekKey,
            displayName: user.displayName || user.email.split('@')[0]
          }, { merge: true });

          const rewardBox = document.createElement('div');
          rewardBox.className = 'reward-box';
          rewardBox.innerHTML = `
            <div class="reward-item">
              <div class="reward-icon">${starIcon(22)}</div>
              <div class="reward-amount star">+${newlyRewarded}</div>
              <div class="reward-label">Yulduzcha</div>
            </div>
            <div class="reward-divider"></div>
            <div class="reward-item">
              <div class="reward-icon">${icon('coins',{size:22,color:'#34d399'})}</div>
              <div class="reward-amount coin">+${newlyRewarded}</div>
              <div class="reward-label">Tanga</div>
            </div>
          `;
          document.querySelector('.results-hero').appendChild(rewardBox);
        } else {
          const infoBox = document.createElement('div');
          infoBox.className = 'reward-box';
          infoBox.style.opacity = '0.6';
          infoBox.innerHTML = `
            <div style="text-align:center;color:var(--text-muted);font-size:0.9rem;">
              ${icon('medal',{size:16,color:'#fbbf24'})} Bu so'zlar uchun mukofot oldin berilgan
            </div>
          `;
          document.querySelector('.results-hero').appendChild(infoBox);
        }

      } catch(e) {
        console.error('Reward xato:', e);
      }
    });

    const pct = perfectWords / totalWords;
    if (pct === 1) {
      document.getElementById('result-emoji').innerHTML = icon('trophy',{size:64,color:'#fbbf24'});
      document.getElementById('result-title').textContent = 'Mukammal natija!';
      document.getElementById('result-subtitle').textContent = "Barcha so'zlarni to'liq o'zlashtirdingiz!";
    } else if (pct >= 0.7) {
      document.getElementById('result-emoji').innerHTML = icon('party-popper',{size:64,color:'var(--purple-light)'});
      document.getElementById('result-title').textContent = "Zo'r natija!";
      document.getElementById('result-subtitle').textContent = 'Juda yaxshi, davom eting!';
    } else if (pct >= 0.4) {
      document.getElementById('result-emoji').innerHTML = icon('dumbbell',{size:64,color:'var(--purple-light)'});
      document.getElementById('result-title').textContent = 'Yaxshi urinish!';
      document.getElementById('result-subtitle').textContent = 'Yana bir marta ishlasangiz yanada yaxshi bo\'ladi.';
    } else {
      document.getElementById('result-emoji').innerHTML = icon('book-open',{size:64,color:'var(--purple-light)'});
      document.getElementById('result-title').textContent = "O'rganishda davom eting!";
      document.getElementById('result-subtitle').textContent = 'Qaytadan ishlash tavsiya etiladi.';
    }

    if (mistakeWords.length > 0) {
      document.getElementById('mistakes-section').style.display = 'block';
      const mistakesList = document.getElementById('mistakes-list');
      mistakeWords.forEach(word => {
        const r = results[word.id];
        const div = document.createElement('div');
        div.className = 'result-item has-mistakes';
        div.innerHTML = `
          <div class="result-icon">${icon('x-circle',{size:18,color:'var(--danger)'})}</div>
          <div class="result-word">
            <div class="result-en">${word.en}</div>
            <div class="result-uz">${word.uz}</div>
            <div class="result-mistakes">Xato bosqichlar: ${r.mistakes.map(s => STAGE_NAMES[s]).join(', ')}</div>
            <div class="correct-answer-box">
              <div class="correct-answer-label">${icon('pen-line',{size:14,color:'var(--success)'})} To'g'ri javob</div>
              <div class="correct-answer-row">
                <span class="correct-en">${word.en}</span>
                <span class="correct-arrow">→</span>
                <span class="correct-uz">${word.uz}</span>
              </div>
              ${word.example ? `<div class="correct-example">"${word.example}"</div>` : ''}
            </div>
          </div>
        `;
        mistakesList.appendChild(div);
      });
    }

    const list = document.getElementById('results-list');
    words.forEach(word => {
      const r = results[word.id];
      const perfect = r.mistakes.length === 0;
      const div = document.createElement('div');
      div.className = `result-item ${perfect ? 'perfect' : 'has-mistakes'}`;
      div.innerHTML = `
        <div class="result-icon">${perfect ? icon('circle-check',{size:18,color:'var(--success)'}) : icon('x-circle',{size:18,color:'var(--danger)'})}</div>
        <div class="result-word">
          <div class="result-en">${word.en}</div>
          <div class="result-uz">${word.uz}</div>
          ${perfect
            ? `<div class="result-ok">${icon('check',{size:14,color:'var(--success)'})} Barcha bosqichlar to'g'ri</div>`
            : `<div class="result-mistakes">${icon('x',{size:14})} Xato bosqichlar: ${r.mistakes.map(s => STAGE_NAMES[s]).join(', ')}</div>`
          }
        </div>
      `;
      list.appendChild(div);
    });

    window.retry = () => {
      window.location.href = `study.html?id=${folderId}`;
    };
  </script>
</body>
</html>
