<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AzWord — Bo'lim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="premium-pages.css"/>
  <link rel="stylesheet" href="mobile.css"/>
  <script src="transition.js"></script>
  <script src="ripple.js"></script>
  <script src="cursor-glow.js"></script>
  <script src="brand.js"></script>
  <script src="confetti.js"></script>
  <script src="sound.js"></script>
  <script src="search.js"></script>
  <script src="effects.js"></script>
  <script src="parallax.js"></script>
  <script src="mobile-nav.js" defer></script>
  <style>
    .folder-page { max-width: 900px; margin: 0 auto; padding: 36px 24px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 28px;
      font-family: 'Inter', sans-serif;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--text-main); }

    .folder-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .folder-title .fi { font-size: 2.2rem; }
    .folder-title h1 { font-size: 1.6rem; font-weight: 700; }
    .folder-title .word-count { color: var(--text-muted); font-size: 0.875rem; margin-top: 3px; }

    .header-actions { display: flex; gap: 10px; }

    .words-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .word-item {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .word-item:hover { border-color: var(--purple-main); }

    .word-left { flex: 1; }
    .word-en {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .word-uz {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .word-example {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      font-style: italic;
    }

    .word-num {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }

    .word-actions { display: flex; gap: 6px; }

    .btn-study {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.2s;
    }
    .btn-study:hover { opacity: 0.88; }
    .btn-study:disabled { opacity: 0.4; cursor: not-allowed; }

    .words-empty {
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      padding: 56px 24px;
      color: var(--text-muted);
      border: 1.5px dashed var(--border);
      border-radius: 14px;
    }
    .words-empty .emoji { font-size: 2.5rem; margin-bottom: 12px; }

    .btn-upload {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: transparent;
      border: 1.5px solid var(--purple-main);
      color: var(--purple-light);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn-upload:hover { background: var(--purple-glow); }

    .modal h3 { margin-bottom: 20px; font-size: 1.15rem; }

    .ai-example-box {
      background: rgba(124,58,237,0.08);
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .ai-example-label {
      font-size: 0.72rem;
      color: var(--purple-light);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .ai-example-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
    }
    .ai-loading {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .ai-loading span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--purple-light);
      animation: dot-bounce 1.2s infinite;
    }
    .ai-loading span:nth-child(2) { animation-delay: 0.2s; }
    .ai-loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 640px) {
      .folder-header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btn-study { grid-column: 1 / -1; }
      .btn-ai-gen { grid-column: 1 / -1; }
      .word-item { padding: 12px 14px; }
      .word-num { display: none; }
    }

    /* ── TOPICS MODE (admin bo'limlar, mavzularga bo'lingan) ── */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .topic-card {
      position: relative;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .topic-card:hover { transform: translateY(-4px); border-color: var(--purple-main); box-shadow: 0 10px 26px rgba(124,58,237,0.25); }
    .topic-num { font-family:'Space Grotesk',sans-serif; font-weight:700; color: var(--purple-light); font-size:0.8rem; margin-bottom:8px; }
    .topic-name { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1rem; margin-bottom:4px; }
    .topic-meta { font-size:0.78rem; color:var(--text-muted); margin-bottom:14px; }
    .topic-progress { height:5px; background:rgba(255,255,255,0.04); border-radius:99px; overflow:hidden; margin-bottom:14px; }
    .topic-progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg, var(--purple-main), var(--purple-light)); }
    .topic-btn {
      display:flex; align-items:center; justify-content:center; gap:6px;
      width:100%; padding:10px; border:none; border-radius:10px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-light));
      color:#fff; font-size:0.85rem; font-weight:600; cursor:pointer;
      transition: filter 0.2s;
    }
    .topic-btn:hover { filter: brightness(1.08); }

    .btn-ai-gen {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(192,132,252,0.2));
      border: 1.5px solid rgba(124,58,237,0.5);
      color: var(--purple-light);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      transition: all 0.2s;
    }
    .btn-ai-gen:hover { background: var(--purple-glow); border-color: var(--purple-main); }
    .btn-ai-gen.locked { opacity: 0.5; cursor: not-allowed; }
    .btn-ai-gen .uses-badge {
      background: rgba(52,211,153,0.15);
      border: 1px solid rgba(52,211,153,0.3);
      color: #34d399;
      border-radius: 99px;
      padding: 1px 7px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .ai-gen-modal { max-width: 500px; }
    .ai-gen-form { display: flex; flex-direction: column; gap: 12px; }
    .ai-gen-form input, .ai-gen-form select {
      width: 100%;
      background: var(--bg-deep);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text-main);
      font-family: "Inter", sans-serif;
      font-size: 0.9rem;
      outline: none;
    }
    .ai-gen-form input:focus, .ai-gen-form select:focus { border-color: var(--purple-main); }
    .ai-gen-progress {
      background: var(--bg-deep);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      margin-top: 8px;
    }
    .ai-gen-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--purple-main), var(--purple-light));
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s;
    }
    .ai-gen-result {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 8px;
    }
    .ai-gen-word-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .ai-gen-word-row:last-child { border-bottom: none; }
    .ai-gen-word-row:hover { background: var(--bg-hover); }
    .agwr-en { font-weight: 600; min-width: 90px; font-family: "Space Grotesk", sans-serif; }
    .agwr-uz { color: var(--text-muted); flex: 1; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="nav-logo" href="dashboard.html"><img src="logo.png" alt="AzWord"></a>
    <div class="nav-user">
      <span id="user-name">...</span>

  </nav>

  <div class="folder-page">

    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Orqaga

          <span class="uses-badge" id="ai-uses-badge">0</span>
        </button>
        <button class="btn-upload" onclick="goUpload()">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Fayl yuklash
        </button>
        <button class="btn-add" onclick="openAddModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> So'z qo'shish
        </button>
        <button class="btn-study" id="study-btn" onclick="startStudy()" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><polygon points="6 3 20 12 6 21 6 3"/></svg> Mashq boshlash

    <div class="words-list" id="words-list">
      <div class="words-empty">

          <circle cx="82" cy="88" r="16" fill="#7c3aed"/>

          <path d="M79 91 L82 94 L85 91" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <div class="emoji" id="empty-emoji-1"></div>

  </div>

  <!-- Modal: So'z qo'shish -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h3>Yangi so'z qo'shish</h3>
      <div class="form-group">
        <label>Inglizcha so'z</label>

  <!-- AI Generator Modal -->
  <div class="modal-overlay" id="ai-gen-modal">
    <div class="modal ai-gen-modal">
      <h3><span id="ai-gen-title-icon"></span> AI Word Generator</h3>
      <div id="ai-gen-step1">
        <div class="ai-gen-form">

            <input type="text" id="ag-topic" placeholder="Medical, Animals, Business..." />
          </div>
          <div>
            <label style="display:block;font-size:0.78rem;color:var(--text-muted);margin-bottom:6px;font-weight:600">Daraja</label>
            <select id="ag-level">
              <option value="A1">A1 - Boshlangich</option>
              <option value="A2">A2 - Elementary</option>

              <option value="B2">B2 - Upper-Intermediate</option>
              <option value="C1">C1 - Advanced</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:0.78rem;color:var(--text-muted);margin-bottom:6px;font-weight:600">Son</label>
            <select id="ag-count">
              <option value="10">10 ta</option>
              <option value="20" selected>20 ta</option>

            </select>

        <div style="margin-top:12px;font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:6px">
          <span id="ag-sparkles-icon"></span> Qolgan: <strong id="ag-uses-left" style="color:var(--success)">0</strong> marta
        </div>
        <div class="modal-actions" style="margin-top:14px">
          <button class="btn-cancel" onclick="closeAIGenModal()">Bekor</button>
          <button class="btn-confirm" id="ag-generate-btn" onclick="runAIGenerator()">Yaratish</button>
        </div>
      </div>
      <div id="ai-gen-step2" style="display:none">
        <div style="text-align:center;padding:8px 0 12px">
          <div id="ag-status" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px">Generatsiya qilinmoqda...</div>
          <div class="ai-gen-progress"><div class="ai-gen-progress-bar" id="ag-bar"></div></div>
        </div>
        <div class="ai-gen-result" id="ag-result" style="display:none"></div>
        <div class="modal-actions" style="margin-top:12px" id="ag-save-actions" style="display:none">
          <button class="btn-cancel" onclick="closeAIGenModal()">Yopish</button>

        </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, collection, addDoc, getDocs, deleteDoc,
      updateDoc, query, orderBy, serverTimestamp, increment, where
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { icon, fromEmoji, starIcon } from './icons.js';

    const emptyEmoji1 = document.getElementById('empty-emoji-1');
    if (emptyEmoji1) emptyEmoji1.innerHTML = icon('file-text', {size:32,color:'var(--purple-light)'});
    const agSparkles = document.getElementById('ag-sparkles-icon');
    if (agSparkles) agSparkles.innerHTML = icon('sparkles', {size:14});
    const aiExampleIcon = document.getElementById('ai-example-icon');
    if (aiExampleIcon) aiExampleIcon.innerHTML = icon('bot', {size:14,color:'var(--purple-light)'});
    const aiGenTitleIcon = document.getElementById('ai-gen-title-icon');
    if (aiGenTitleIcon) aiGenTitleIcon.innerHTML = icon('bot', {size:18,color:'var(--purple-light)'});

    const params = new URLSearchParams(window.location.search);
    const folderId = params.get('id');
    let currentUser = null;
    let words = [];
    let folderTopicMode = false;
    let folderName = '';
    let folderIsAdmin = false;

    if (!folderId) window.location.href = 'dashboard.html';

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = 'index.html';
      currentUser = user;
      document.getElementById('user-name').textContent = user.displayName || user.email;
      await loadFolder();
      if (folderTopicMode) {
        await loadFolderTopics();
      } else {
        await loadWords();
        await loadAIUses(user);
      }
    });

    async function loadFolder() {
      const snap = await getDoc(doc(db, 'folders', folderId));
      if (!snap.exists()) return window.location.href = 'dashboard.html';
      const data = snap.data();
      document.getElementById('folder-emoji').innerHTML = fromEmoji(data.emoji || 'folder', {size:40,color:'var(--purple-light)'});
      document.getElementById('folder-name').textContent = data.name;
      document.title = 'AzWord - ' + data.name;
      folderName = data.name || 'Bo\'lim';
      folderIsAdmin = !!data.isAdmin;

      folderTopicMode = !!(data.isAdmin && (data.topicCount || 0) > 0);
      if (folderTopicMode) {
        document.getElementById('ai-gen-btn').style.display = 'none';
        document.getElementById('study-btn').style.display = 'none';
        document.querySelector('.btn-upload').style.display = 'none';
        document.querySelector('.btn-add').style.display = 'none';
        document.getElementById('word-count').textContent = (data.topicCount || 0) + ' ta mavzu';
      }
    }

    async function loadFolderTopics() {
      const container = document.getElementById('words-list');
      container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-muted)">Yuklanmoqda...</div>';
      const snap = await getDocs(query(collection(db, 'folders', folderId, 'topics'), orderBy('order', 'asc')));
      if (snap.empty) {
        container.innerHTML = '<div class="words-empty"><p>Hozircha mavzular qoshilmagan.</p></div>';
        return;
      }
      container.className = 'topics-grid';
      container.innerHTML = '';
      let i = 1;
      snap.forEach(d => {
        const t = d.data();
        let pct = 0;
        if (t.lastScore) {
          const parts = String(t.lastScore).split('/').map(Number);
          const done = parts[0] || 0, total = parts[1] || 0;
          if (total > 0) pct = Math.round((done / total) * 100);
        }
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.innerHTML =
          '<div class="topic-num">' + (i++) + '</div>' +
          '<div class="topic-name">' + (t.title || 'Mavzu') + '</div>' +
          '<div class="topic-meta">' + (t.wordCount || 0) + ' ta so\'z' + (t.lastScore ? ' &middot; ' + t.lastScore : '') + '</div>' +
          '<div class="topic-progress"><div class="topic-progress-fill" style="width:' + pct + '%"></div></div>' +
          '<button class="topic-btn" type="button">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg> Boshlash</button>';
        const topicBtn = card.querySelector('.topic-btn');
        const topicId = d.id, topicTitle = t.title || 'Mavzu';
        topicBtn.addEventListener('click', () => goStudyTopic(folderId, folderName, topicId, topicTitle));
        container.appendChild(card);
      });
    }

    async function loadWords() {
      const q = query(collection(db, 'folders', folderId, 'words'), orderBy('createdAt', 'asc'));
      const snap = await getDocs(q);
      words = [];
      snap.forEach(d => words.push({ id: d.id, ...d.data() }));
      renderWords();
    }

    function renderWords() {
      const container = document.getElementById('words-list');
      const countEl = document.getElementById('word-count');
      const studyBtn = document.getElementById('study-btn');

      countEl.textContent = `${words.length} ta so'z`;
      studyBtn.disabled = words.length === 0;

      if (words.length === 0) {
        container.innerHTML = `
          <div class="words-empty">
            <svg width="100" height="100" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:8px;opacity:0.7">
              <rect x="20" y="15" width="80" height="90" rx="10" fill="#2e2845" stroke="#4a3f6b" stroke-width="2"/>
              <rect x="32" y="35" width="56" height="4" rx="2" fill="#4a3f6b"/>
              <rect x="32" y="46" width="40" height="4" rx="2" fill="#3d3160"/>
              <rect x="32" y="57" width="48" height="4" rx="2" fill="#4a3f6b"/>
              <circle cx="82" cy="88" r="16" fill="#7c3aed"/>
              <path d="M77 88 L82 93 L90 83" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="emoji">${icon('file-text',{size:32,color:'var(--purple-light)'})}</div>
            <p>Hali so'z yo'q. Birinchi so'zingizni qo'shing!</p>
          </div>`;
        return;
      }

      container.innerHTML = '';
      words.forEach((w, i) => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="word-num">${i + 1}</div>
          <div class="word-left">
            <div class="word-en">${w.en}</div>
            <div class="word-uz">${w.uz}</div>
            ${w.example ? `<div class="word-example">"${w.example}"</div>` : ''}
          </div>
          <div class="word-actions">
            <button class="icon-btn" onclick="deleteWord('${w.id}')" title="O'chirish"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    let aiGeneratedExample = '';
    let aiDebounceTimer = null;

    window.openAddModal = () => {
      document.getElementById('add-modal').classList.add('open');
      setTimeout(() => document.getElementById('word-en').focus(), 100);
    };

    window.closeAddModal = () => {
      document.getElementById('add-modal').classList.remove('open');
      document.getElementById('word-en').value = '';
      document.getElementById('word-uz').value = '';
      document.getElementById('ai-example-box').style.display = 'none';
      document.getElementById('ai-example-text').innerHTML = '';
      aiGeneratedExample = '';
      clearTimeout(aiDebounceTimer);
    };

    document.getElementById('word-en').addEventListener('input', function() {
      const en = this.value.trim();
      const uz = document.getElementById('word-uz').value.trim();
      clearTimeout(aiDebounceTimer);
      if (en.length >= 2 && uz.length >= 1) {
        aiDebounceTimer = setTimeout(() => generateExample(en, uz), 800);
      }
    });

    document.getElementById('word-uz').addEventListener('input', function() {
      const en = document.getElementById('word-en').value.trim();
      const uz = this.value.trim();
      clearTimeout(aiDebounceTimer);
      if (en.length >= 2 && uz.length >= 1) {
        aiDebounceTimer = setTimeout(() => generateExample(en, uz), 800);
      }
    });

    async function generateExample(en, uz) {
      const box = document.getElementById('ai-example-box');
      const textEl = document.getElementById('ai-example-text');
      box.style.display = 'block';
      textEl.innerHTML = '<span class="ai-loading"><span></span><span></span><span></span></span>';
      aiGeneratedExample = '';

      try {
        const prompt = `Write ONE simple, short English example sentence using the word "${en}" (which means "${uz}" in Uzbek). The sentence should be easy to understand for beginners. Reply ONLY with the sentence, nothing else. No quotes, no explanation.`;
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        if (!res.ok) {
          box.style.display = 'none';
          aiGeneratedExample = '';
          return;
        }

        const data = await res.json();
        const sentence = data.choices[0].message.content.trim().replace(/^["']|["']$/g, '');
        aiGeneratedExample = sentence;
        textEl.textContent = '"' + sentence + '"';
      } catch(e) {
        console.error('generateExample error:', e);
        box.style.display = 'none';
        aiGeneratedExample = '';
      }
    }

    window.addWord = async () => {
      const en = document.getElementById('word-en').value.trim();
      const uz = document.getElementById('word-uz').value.trim();

      if (!en || !uz) return showToast("Inglizcha va o'zbekcha so'zlarni kiriting!", true);

      const btn = document.getElementById('add-btn');
      btn.disabled = true;

      const docRef = await addDoc(collection(db, 'folders', folderId, 'words'), {
        en, uz,
        example: aiGeneratedExample || '',
        createdAt: serverTimestamp()
      });

      await updateDoc(doc(db, 'folders', folderId), {
        wordCount: increment(1)
      });

      btn.disabled = false;
      closeAddModal();
      showToast("So'z qo'shildi! ?");
      await loadWords();

      if (!aiGeneratedExample && en.length >= 2 && uz.length >= 1) {
        generateExample(en, uz).then(async () => {
          if (aiGeneratedExample) {
            await updateDoc(doc(db, 'folders', folderId, 'words', docRef.id), {
              example: aiGeneratedExample
            });
            await loadWords();
          }
        });
      }
    };

    window.deleteWord = async (wordId) => {
      if (!confirm("Bu so'zni o'chirasizmi?")) return;
      await deleteDoc(doc(db, 'folders', folderId, 'words', wordId));
      await updateDoc(doc(db, 'folders', folderId), {
        wordCount: increment(-1)
      });
      showToast("O'chirildi", true);
      await loadWords();
    };

    window.goStudyTopic = (id, name, topicId, topicName) => {
      try {
        localStorage.setItem('az:lastFolder', JSON.stringify({ kind: 'folder', id, name, topic: topicId, topicName }));
      } catch (e) {}
      window.location.href = `study.html?id=${id}&topic=${topicId}`;
    };

    window.startStudy = () => {
      if (words.length === 0) return;
      try {
        localStorage.setItem('az:lastFolder', JSON.stringify({ kind: 'folder', id: folderId, name: folderName }));
      } catch (e) {}
      window.location.href = `study.html?id=${folderId}`;
    };

    window.goUpload = () => {
      window.location.href = `upload.html?id=${folderId}`;
    };

    window.logout = async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    };

    document.getElementById('ai-gen-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('ai-gen-modal')) closeAIGenModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('add-modal').classList.contains('open')) {
        window.addWord();
      }
    });

    let aiGenWords = [];

    async function loadAIUses(user) {
      try {
        const ud = await getDoc(doc(db, 'users', user.uid));
        const uses = ud.exists() ? (ud.data().aiGeneratorUses || 0) : 0;
        const btn = document.getElementById('ai-gen-btn');
        const badge = document.getElementById('ai-uses-badge');
        if (badge) badge.textContent = uses;
        if (btn) {
          if (uses > 0) {
            btn.classList.remove('locked');
          } else {
            btn.classList.add('locked');
          }
        }
        window._aiUses = uses;
      } catch(e) {}
    }

    window.openAIGenModal = () => {
      if (!window._aiUses || window._aiUses <= 0) {
        showToast('AI Generator sotib oling! Shop ga boring', true);
        setTimeout(() => window.location.href = 'shop.html', 1500);
        return;
      }
      document.getElementById('ag-uses-left').textContent = window._aiUses;
      document.getElementById('ai-gen-step1').style.display = 'block';
      document.getElementById('ai-gen-step2').style.display = 'none';
      document.getElementById('ag-result').style.display = 'none';
      document.getElementById('ag-save-actions').style.display = 'none';
      aiGenWords = [];
      document.getElementById('ai-gen-modal').classList.add('open');
    };

    window.closeAIGenModal = () => {
      document.getElementById('ai-gen-modal').classList.remove('open');
    };

    window.runAIGenerator = async () => {
      const topic = document.getElementById('ag-topic').value.trim();
      const level = document.getElementById('ag-level').value;
      const count = document.getElementById('ag-count').value;
      if (!topic) { showToast('Mavzu kiriting', true); return; }

      const genBtn = document.getElementById('ag-generate-btn');
      genBtn.disabled = true;

      document.getElementById('ai-gen-step1').style.display = 'none';
      document.getElementById('ai-gen-step2').style.display = 'block';

      const bar = document.getElementById('ag-bar');
      const status = document.getElementById('ag-status');
      bar.style.width = '15%';
      status.textContent = 'AI generatsiya qilmoqda...';

      try {
        const prompt = `Generate exactly ${count} English vocabulary words about "${topic}" at level ${level}. Return ONLY a JSON array. Each object: {"en":"word","uz":"uzbek translation","example":"one simple sentence"}. No markdown, no explanation.`;

        bar.style.width = '40%';
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        bar.style.width = '75%';
        status.textContent = 'Natija tahlil qilinmoqda...';

        const data = await res.json();

        if (!res.ok || !data.choices || !data.choices[0]) {
          const errMsg = data?.error?.message || 'API javob bermadi';
          throw new Error(errMsg);
        }

        const text = data.choices[0].message.content.trim();

        let parsed;
        try { parsed = JSON.parse(text); }
        catch(e) {
          const m = text.match(/\[[\s\S]*\]/);
          parsed = m ? JSON.parse(m[0]) : [];
        }
        
        if (!parsed || parsed.length === 0) {
          throw new Error("AI so'z generatsiya qila olmadi. Mavzuni o'zgartiring.");
        }

        bar.style.width = '100%';
        status.textContent = parsed.length + ' ta soz tayyor!';
        aiGenWords = parsed;

        const resultEl = document.getElementById('ag-result');
        resultEl.innerHTML = parsed.map((w,i) => `
          <div class="ai-gen-word-row">
            <span style="color:var(--text-dim);min-width:20px">${i+1}</span>
            <span class="agwr-en">${w.en}</span>
            <span class="agwr-uz">${w.uz}</span>
          </div>`).join('');
        resultEl.style.display = 'block';
        document.getElementById('ag-save-actions').style.display = 'flex';
        document.getElementById('ag-save-btn').textContent = parsed.length + ' ta soz qoshish';

      } catch(e) {
        status.textContent = 'Xato: ' + (e.message || 'Qayta urinib ko\'ring');
        bar.style.background = 'var(--danger)';
        setTimeout(() => {
          document.getElementById('ai-gen-step1').style.display = 'block';
          document.getElementById('ai-gen-step2').style.display = 'none';
          bar.style.background = '';
          bar.style.width = '0%';
        }, 2500);
        genBtn.disabled = false;
      }
    };

    window.saveAIWords = async () => {
      if (!aiGenWords.length) return;
      const btn = document.getElementById('ag-save-btn');
      btn.disabled = true; btn.textContent = 'Saqlanmoqda...';

      try {
        const allFoldersSnap = await getDocs(query(
          collection(db, 'folders'), where('uid', '==', currentUser.uid)
        ));
        const globalExisting = new Set();
        for (const fd of allFoldersSnap.docs) {
          const ws = await getDocs(collection(db, 'folders', fd.id, 'words'));
          ws.forEach(d => globalExisting.add(d.data().en.toLowerCase()));
        }

        const newWords = aiGenWords.filter(w => !globalExisting.has(w.en.toLowerCase()));
        const skipped = aiGenWords.length - newWords.length;

        for (const w of newWords) {
          await addDoc(collection(db, 'folders', folderId, 'words'), {
            en: w.en.toLowerCase(), uz: w.uz, example: w.example || '',
            createdAt: serverTimestamp()
          });
        }

        if (newWords.length) {
          await updateDoc(doc(db, 'folders', folderId), { wordCount: increment(newWords.length) });
        }

        const newUses = Math.max(0, (window._aiUses || 1) - 1);
        await updateDoc(doc(db, 'users', currentUser.uid), { aiGeneratorUses: newUses });
        window._aiUses = newUses;
        const badge = document.getElementById('ai-uses-badge');
        if (badge) badge.textContent = newUses;
        if (newUses <= 0) {
          const genBtn = document.getElementById('ai-gen-btn');
          if (genBtn) genBtn.classList.add('locked');
        }

        showToast(newWords.length + ' ta soz qoshildi!' + (skipped ? ' (' + skipped + ' takror)' : ''));
        closeAIGenModal();
        await loadWords();

      } catch(e) { showToast('Xato: ' + e.message, true); }
      btn.disabled = false;
    };

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
  <script>if(window.lucide) lucide.createIcons();</script>
</body>
