<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosh sahifa · AzWord</title>
  <meta name="description" content="AzWord bosh sahifasi — kunlik maqsad, streak va o'rganish bo'limlari.">
  <meta name="theme-color" content="#0e0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var p=JSON.parse(localStorage.getItem('az:prefs')||'{}'),t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.effects===false)document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <script type="module" src="js/pages/dashboard.js"></script>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"><div class="boot-logo"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 50 L32 14 L47 50"/><path d="M22.5 38 L41.5 38"/></svg></div></div></div>
  <main class="page">
    <section class="hero">
      <div class="hero-main fade-up">
        <a class="hero-level" id="hero-level" href="stats.html"></a>
        <div class="hero-greet" id="hero-greet">Xayrli kun</div>
        <h1 class="hero-name" id="hero-name">&nbsp;</h1>
        <p class="hero-sub" id="hero-sub">Bugun ham bir qadam oldinga.</p>
        <div class="hero-stats" id="hero-stats"></div>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
      <div class="hero-side">
        <div class="card goal-card fade-up" id="goal-card"></div>
        <a class="card card-link fade-up" href="streak.html" id="streak-card"></a>
      </div>
    </section>

    <div id="announce" class="mt-4"></div>

    <section class="section">
      <div class="grid-4 stagger" id="kpis"></div>
    </section>

    <section class="section" id="books-section">
      <div class="section-head"><h2 class="section-title" id="books-title"></h2><a class="btn btn-ghost btn-sm" href="folders.html">Barchasi</a></div>
      <div class="grid-auto-sm" id="books"></div>
    </section>

    <section class="section" id="public-section">
      <div class="section-head"><h2 class="section-title" id="public-title"></h2><a class="btn btn-ghost btn-sm" href="folders.html?tab=topics">Barchasi</a></div>
      <div class="grid-auto-sm" id="public"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title" id="mine-title"></h2><button class="btn btn-sm" id="new-folder"></button></div>
      <div class="grid-auto" id="mine"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title" id="recent-title"></h2><a class="btn btn-ghost btn-sm" href="stats.html">Statistika</a></div>
      <div class="card card-flush" id="recent"></div>
    </section>
  </main>
</body>
</html>
