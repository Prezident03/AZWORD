<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>So'zlarni yuklash · AzWord</title>
  <meta name="description" content="Excel, Word yoki matn faylidan so'zlarni yuklash.">
  <meta name="theme-color" content="#0e0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var p=JSON.parse(localStorage.getItem('az:prefs')||'{}'),t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.effects===false)document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <script type="module" src="js/pages/upload.js"></script>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"><div class="boot-logo"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 50 L32 14 L47 50"/><path d="M22.5 38 L41.5 38"/></svg></div></div></div>
  <main class="page page-narrow">
    <div class="page-head">
      <div>
        <h1 class="page-title">So'zlarni yuklash</h1>
        <p class="page-sub" id="folder-name">Fayldan yoki matndan so'zlarni bo'limga qo'shing</p>
      </div>
    </div>

    <div class="card mb-4">
      <div class="tabs mb-4" id="mode">
        <button class="tab active" data-m="file">Fayl</button>
        <button class="tab" data-m="text">Matn</button>
      </div>
      <div data-pane="file">
        <label class="dropzone" id="drop" for="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div class="bold">Faylni shu yerga tashlang yoki tanlang</div>
          <div class="xs dim">TXT, CSV, XLSX, XLS yoki DOCX · 2 MB gacha</div>
        </label>
        <input type="file" id="file" accept=".txt,.csv,.xlsx,.xls,.docx" hidden>
      </div>
      <div data-pane="text" hidden>
        <textarea class="textarea" id="text" rows="8" placeholder="apple - olma&#10;book, kitob, This book is interesting.&#10;water	suv"></textarea>
        <button class="btn mt-3" id="parse-text">Tahlil qilish</button>
      </div>
      <div class="form-error mt-3" id="err"></div>
    </div>

    <div class="card mb-4">
      <div class="card-title mb-2">Format</div>
      <p class="small muted">Har bir qatorda: <b>inglizcha</b>, <b>o'zbekcha</b> va ixtiyoriy <b>misol gap</b>. Ajratuvchi: tab, vergul, nuqta-vergul yoki " - ". Excel'da: A ustun — inglizcha, B — o'zbekcha, C — misol.</p>
    </div>

    <section id="preview" hidden>
      <div class="section-head wrap">
        <h2 class="section-title" id="preview-title"></h2>
        <label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="ai-fill" style="width:18px;height:18px;accent-color:var(--primary)"> Misolsiz so'zlarga AI misol yozsin</label>
      </div>
      <div class="card card-flush" style="max-height:52vh;overflow:auto" id="rows"></div>
      <div class="row mt-4">
        <a class="btn btn-ghost" id="cancel">Bekor qilish</a>
        <span class="grow"></span>
        <button class="btn btn-primary btn-lg" id="save"></button>
      </div>
    </section>
  </main>
</body>
</html>
