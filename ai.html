<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI yordamchi · AzWord</title>
  <meta name="description" content="AzWord AI — ingliz tili bo'yicha savollaringizga javob beruvchi yordamchi.">
  <meta name="theme-color" content="#0e0b1f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var p=JSON.parse(localStorage.getItem('az:prefs')||'{}'),t=p.theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.effects===false)document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <script type="module" src="js/pages/ai.js"></script>
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="boot-mark"><div class="boot-logo"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 50 L32 14 L47 50"/><path d="M22.5 38 L41.5 38"/></svg></div></div></div>
  <main class="page page-narrow">
    <div class="chat">
      <div class="chat-log" id="log" aria-live="polite"></div>
      <form class="chat-input" id="form">
        <textarea class="textarea" id="msg" rows="1" maxlength="1000" placeholder="Savolingizni yozing... (masalan: &quot;make&quot; va &quot;do&quot; farqi nima?)" aria-label="Xabar"></textarea>
        <button class="btn btn-primary btn-icon" style="height:46px;width:46px" type="submit" id="send" aria-label="Yuborish"></button>
      </form>
    </div>
  </main>
</body>
</html>
