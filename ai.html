<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AzWord — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="premium-pages.css"/>
  <script src="transition.js"></script>
  <script src="ripple.js"></script>
  <script src="cursor-glow.js"></script>
  <script src="brand.js"></script>
  <script src="confetti.js"></script>
  <script src="sound.js"></script>
  <script src="search.js"></script>
  <script src="effects.js"></script>
  <script src="parallax.js"></script>
  <style>
    .simple-wrap { max-width: 920px; margin: 0 auto; padding: 36px 24px; }
    .simple-head { display:flex; align-items:center; justify-content:space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: 0.9rem; cursor: pointer;
      border: none; background: none; padding: 0;
      font-family: var(--font-body);
      transition: color var(--dur-fast);
    }
    .back-btn:hover { color: var(--text-main); }
    .simple-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--elev-card);
      overflow: hidden;
      position: relative;
    }
    .simple-card::before {
      content:'';
      position:absolute;
      inset:0;
      background: radial-gradient(ellipse at 90% 10%, rgba(124,58,237,0.18), transparent 55%),
                  radial-gradient(ellipse at 20% 90%, rgba(236,72,153,0.12), transparent 55%);
      pointer-events:none;
    }
    .simple-card > * { position: relative; z-index: 1; }
    .simple-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.35rem;
      margin: 0 0 8px;
      color: var(--text-main);
    }
    .simple-sub { margin: 0; color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }
    .simple-actions { margin-top: 16px; display:flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="simple-wrap">
    <div class="simple-head">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </button>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a class="btn-add" href="study.html" style="text-decoration:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Study
        </a>
        <a class="btn-add" href="profile.html" style="text-decoration:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </div>
    </div>

    <section class="simple-card">
      <h1 class="simple-title">AI Assistant</h1>
      <p class="simple-sub">Bu bo‘lim hozircha tayyorlanmoqda. Tez orada AI Coach orqali so‘zlar, misollar va individual reja bo‘yicha yordam beramiz.</p>
      <div class="simple-actions">
        <a class="btn-add" href="shop.html" style="text-decoration:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Shop
        </a>
        <a class="btn-add" href="stats.html" style="text-decoration:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Statistics
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import { auth } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    onAuthStateChanged(auth, user => { if (!user) location.href = 'index.html'; });
  </script>
</body>
</html>
